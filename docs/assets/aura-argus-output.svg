<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Actual AuraArgus CLI output">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .dim { fill: #8b949e; }
      .text { fill: #c9d1d9; }
      .key { fill: #79c0ff; }
      .str { fill: #a5d6ff; }
      .num { fill: #d2a8ff; }
      .ok { fill: #7ee787; }
      .url { fill: #58a6ff; }
      .prompt { fill: #7ee787; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="560" rx="18"/>
  <rect class="panel" x="24" y="24" width="1152" height="512" rx="14"/>

  <circle cx="52" cy="52" r="6" fill="#ff7b72"/>
  <circle cx="72" cy="52" r="6" fill="#d29922"/>
  <circle cx="92" cy="52" r="6" fill="#3fb950"/>

  <text x="116" y="57" class="sans" fill="#8b949e" font-size="14">AuraArgus · actual CLI output (trimmed)</text>
  <text x="1120" y="57" class="mono" fill="#484f58" font-size="12" text-anchor="end">v0.1.2</text>

  <line x1="48" y1="78" x2="1152" y2="78" stroke="#21262d"/>

  <text x="52" y="112" class="mono" font-size="16">
    <tspan class="prompt">$ </tspan><tspan class="text">aura-argus search </tspan><tspan class="str">"SearXNG 对 429 的冷却时间是多少秒？"</tspan><tspan class="text"> --json</tspan>
  </text>

  <text x="52" y="154" class="mono" font-size="16"><tspan class="text">{</tspan></text>
  <text x="76" y="180" class="mono" font-size="16"><tspan class="key">"schemaVersion"</tspan><tspan class="text">: </tspan><tspan class="num">1</tspan><tspan class="text">,</tspan></text>
  <text x="76" y="206" class="mono" font-size="16"><tspan class="key">"entity"</tspan><tspan class="text">: </tspan><tspan class="str">"searxng"</tspan><tspan class="text">,</tspan></text>
  <text x="76" y="232" class="mono" font-size="16"><tspan class="key">"mode"</tspan><tspan class="text">: </tspan><tspan class="ok">"registry"</tspan><tspan class="text">,</tspan></text>
  <text x="76" y="258" class="mono" font-size="16"><tspan class="key">"tookMs"</tspan><tspan class="text">: </tspan><tspan class="num">988</tspan><tspan class="text">,</tspan></text>
  <text x="76" y="284" class="mono" font-size="16"><tspan class="key">"cached"</tspan><tspan class="text">: </tspan><tspan class="num">false</tspan><tspan class="text">,</tspan></text>
  <text x="76" y="310" class="mono" font-size="16"><tspan class="key">"evidence"</tspan><tspan class="text">: [{</tspan></text>
  <text x="100" y="336" class="mono" font-size="16"><tspan class="key">"url"</tspan><tspan class="text">: </tspan><tspan class="url">"https://docs.searxng.org/admin/settings/settings_search.html"</tspan><tspan class="text">,</tspan></text>
  <text x="100" y="362" class="mono" font-size="16"><tspan class="key">"passages"</tspan><tspan class="text">: [{</tspan></text>
  <text x="124" y="388" class="mono" font-size="16"><tspan class="key">"text"</tspan><tspan class="text">: </tspan><tspan class="str">"… SearxEngineTooManyRequests : 3600 …"</tspan><tspan class="text">,</tspan></text>
  <text x="124" y="414" class="mono" font-size="16"><tspan class="key">"score"</tspan><tspan class="text">: </tspan><tspan class="num">28.7</tspan></text>
  <text x="100" y="440" class="mono" font-size="16"><tspan class="text">}]</tspan></text>
  <text x="76" y="466" class="mono" font-size="16"><tspan class="text">}],</tspan></text>
  <text x="52" y="492" class="mono" font-size="16"><tspan class="text">}</tspan></text>

  <rect x="724" y="188" width="404" height="112" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="748" y="216" class="sans" fill="#8b949e" font-size="13">retrieved passage</text>
  <text x="748" y="248" class="mono" fill="#7ee787" font-size="20">SearxEngineTooManyRequests : 3600</text>
  <text x="748" y="276" class="sans" fill="#c9d1d9" font-size="14">3600 seconds = 60 minutes</text>

  <text x="52" y="524" class="sans" fill="#8b949e" font-size="13">Official source, one passage, URL retained. No API key, no per-call billing.</text>
</svg>
