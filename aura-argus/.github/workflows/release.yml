name: release

# Publishes on a version tag. Configure npm trusted publishing for this repository and the
# `release` workflow (npmjs.com → package settings → Trusted publisher); no long-lived token
# is stored in this repository.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
