name: health

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Verify coverage
        run: npm run verify -- --json > health.json
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-argus-health
          path: health.json
