# 停用内置 tool-fs（连带 read / write / edit / read_image），只留 Aura 两个工具。
#
# 用途：在改持久预设之前，先实测"强制走 Aura"是否可用。
#   dsh --profile headless --patch ./dsh/aura-force.yml "你的任务"
#
# 停用方式：按 id 定向 disable。tool-fs 是宿主层的一行，这里覆盖它。

- id: tool-fs
  disabled: true

- insert:
    - id: tool-aura-read
      name: '../src/aura-read/index.js'

    - id: tool-aura-edit
      name: '../src/aura-edit/index.js'
